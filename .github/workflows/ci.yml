name: ci

on:
  pull_request:
    types: [opened, synchronize]
  push:
   branches:
     - main

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix fmt -- --ci

  auto-merge-dependabot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' && github.repository_owner == 'nix-community' }}
    steps:
      - uses: actions/checkout@v7
      - run: gh pr merge --auto --merge ${{github.event.pull_request.number}}
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  eval-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: compute the systems the flake offers outputs for
        id: set-matrix
        run: |
          set -Eeu
          matrix="$(nix flake show --all-systems --json | jq -cr '[.packages, .checks, .formatter | keys] | add | unique')"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  eval:
    runs-on: ubuntu-latest
    needs: eval-matrix
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJson(needs.eval-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --no-build --option system ${{ matrix.system }}

  checks-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: compute all checks to use as a matrix
        id: set-matrix
        run: |
          set -Eeu
          matrix="$(nix flake show --json | jq '.checks."x86_64-linux"' | jq -cr 'keys')"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
  test:
    runs-on: ubuntu-latest
    needs: checks-matrix
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.checks-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build -L '.#checks.x86_64-linux.${{ matrix.check }}'
